<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Batboot 11-2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#dff5ff;color:#123;text-align:center}
.wrap{max-width:560px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;font-weight:800;margin:5px}
#game{height:650px;max-height:72vh;min-height:460px;position:relative;overflow:hidden;border-radius:24px;border:3px solid white;touch-action:none;background:linear-gradient(#78cfff 0 27%,#e8faff 27% 100%)}
.scenery{position:absolute;inset:0;pointer-events:none}.mount{position:absolute;top:15px;left:18px;font-size:58px}.tree1{position:absolute;top:65px;right:18px;font-size:48px}.tree2{position:absolute;top:115px;left:35px;font-size:38px}.snowman{position:absolute;top:110px;right:55px;font-size:40px}.house{position:absolute;top:105px;left:90px;font-size:42px}.santa{position:absolute;top:62px;left:48%;font-size:32px}
#road{position:absolute;left:6%;right:6%;top:27%;bottom:0;border-left:5px solid #fff;border-right:5px solid #fff;border-radius:48% 48% 0 0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.85) 0 5px,transparent 6px 52px),linear-gradient(90deg,#eaffff,#8fd9f6,#eaffff)}
.l1,.l2{position:absolute;top:27%;bottom:0;border-left:2px solid rgba(255,255,255,.8)}.l1{left:38%}.l2{right:38%}
#objects{position:absolute;inset:0}.bat{position:absolute;bottom:18px;left:calc(50% - 45px);width:90px;transition:left .11s ease;user-select:none}.peng{font-size:72px;line-height:.95}.cap{position:absolute;font-size:28px;top:-15px;left:30px}.ski{font-size:30px;margin-top:-5px}
#msg{position:absolute;top:8px;left:12px;right:12px;background:rgba(255,255,255,.88);padding:8px;border-radius:12px;font-weight:bold}
button{border:0;border-radius:15px;min-height:55px;font-size:20px;font-weight:bold;margin-top:9px}#start{width:100%;background:#1578ff;color:white}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{background:white;border:1px solid #aad3e7}.note{font-size:13px;color:#456;margin-top:7px}
</style></head>
<body><div class="wrap">
<div class="top"><span>❄️ بطبوط 11-2</span><span>⭐ النقاط: <b id="score">0</b> &nbsp; 🍏 <b id="apples">0</b></span></div>
<div id="game">
<div class="scenery"><div class="mount">🏔️</div><div class="tree1">🌲</div><div class="tree2">🌲</div><div class="snowman">⛄</div><div class="house">🏠</div><div class="santa">🎅</div></div>
<div id="road"></div><div class="l1"></div><div class="l2"></div><div id="objects"></div>
<div id="bat" class="bat"><div class="cap">🧢</div><div class="peng">🐧</div><div class="ski">🎿</div></div>
<div id="msg">جاهز؟ اضغط «ابدأ 11-2» وانطلق!</div>
<div id="win" style="display:none;position:absolute;inset:0;background:rgba(0,80,140,.78);z-index:20;align-items:center;justify-content:center;padding:25px">
  <div style="background:white;border-radius:22px;padding:25px;width:100%;max-width:360px">
    <div style="font-size:58px">🏆🐧❄️</div>
    <h2 style="margin:8px 0">أحسنت يا بطل!</h2>
    <p style="font-size:18px;font-weight:bold">أنهيت المرحلة 11-2 ووصلت إلى 500 نقطة!</p>
    <button id="next" style="width:100%;background:#18a558;color:white">🚀 الذهاب إلى المرحلة 11-3</button>
  </div>
</div></div>
<button id="start">▶ ابدأ 11-2</button>
<div class="controls"><button id="right">يمين ◀</button><button id="left">▶ يسار</button></div>
<div class="note">🍏 +10 &nbsp; ⭐ +20 &nbsp; 🐟 +30 &nbsp; 🪨 اصطدام &nbsp; 🧊 حاجز جليدي</div>
</div>
<script>
const G=document.getElementById('game'),P=document.getElementById('bat'),O=document.getElementById('objects'),SC=document.getElementById('score'),AP=document.getElementById('apples'),M=document.getElementById('msg'),S=document.getElementById('start'),ROAD=document.getElementById('road'),WIN=document.getElementById('win'),NEXT=document.getElementById('next');
let lane=1,run=false,score=0,apples=0,items=[],raf=0,last=0,spawnAt=0,bg=0; const L=['23%','50%','77%'];
function place(){P.style.left='calc('+L[lane]+' - 45px)'} function move(d){if(run){lane=Math.max(0,Math.min(2,lane+d));place()}}
function spawn(){let q=Math.random(),t=q<.28?'apple':q<.47?'star':q<.58?'fish':q<.80?'rock':'ice',ln=Math.floor(Math.random()*3),e=document.createElement('div');e.textContent=t==='apple'?'🍏':t==='star'?'⭐':t==='fish'?'🐟':t==='rock'?'🪨':'🧊';e.style.cssText='position:absolute;top:150px;left:calc('+L[ln]+' - 15px);font-size:25px;user-select:none';O.appendChild(e);items.push({e,l:ln,y:150,t,z:25})}
function victory(){run=false;cancelAnimationFrame(raf);score=500;SC.textContent=500;try{localStorage.setItem('batboot_11_2_complete','yes');}catch(e){} WIN.style.display='flex'}
function end(){run=false;cancelAnimationFrame(raf);M.style.display='block';M.textContent='💥 اصطدم بطبوط! النتيجة: '+score+' — جرّب مرة ثانية';S.textContent='↻ إعادة 11-2'}
function loop(t){if(!run)return;let dt=Math.min(32,t-last||16);last=t;bg=(bg+6*dt/16)%52;ROAD.style.backgroundPositionY=bg+'px';if(t-spawnAt>650){spawn();spawnAt=t}
let h=G.clientHeight,a=h-135,b=h-45;
for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=(3.1+Math.min(2.3,score/170))*dt/16;o.z=Math.min(48,o.z+.14*dt/16);o.e.style.top=o.y+'px';o.e.style.fontSize=o.z+'px';
if(o.y>a&&o.y<b&&o.l===lane){if(o.t==='rock'||o.t==='ice'){end();return}else{let add=o.t==='apple'?10:o.t==='star'?20:30;score+=add;if(o.t==='apple')apples++;SC.textContent=score;AP.textContent=apples;o.e.remove();items.splice(i,1);if(score>=500){victory();return}continue}}if(o.y>h){o.e.remove();items.splice(i,1)}}raf=requestAnimationFrame(loop)}
function start(){WIN.style.display='none';cancelAnimationFrame(raf);items.forEach(x=>x.e.remove());items=[];score=0;apples=0;SC.textContent=0;AP.textContent=0;lane=1;place();run=true;M.style.display='none';S.textContent='↻ إعادة 11-2';last=performance.now();spawnAt=last-400;spawn();raf=requestAnimationFrame(loop)}
NEXT.onclick=()=>{alert('🎉 تم فتح المرحلة 11-3! سنضع لعبة 11-3 هنا بعد تجهيزها.');};
S.onclick=start;document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);
let sx=null;G.onpointerdown=e=>sx=e.clientX;G.onpointerup=e=>{if(sx!==null){let d=e.clientX-sx;if(Math.abs(d)>20)move(d>0?1:-1);sx=null}};
document.onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};place();
</script></body></html>

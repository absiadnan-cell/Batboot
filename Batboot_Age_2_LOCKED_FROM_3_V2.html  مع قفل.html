function speak(t){let a=document.getElementById('audio');a.pause();let tl=L==='ar'?'ar':L==='fr'?'fr':'en';a.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+tl+'&q='+encodeURIComponent(t);a.currentTime=0;let p=a.play();if(p)p.catch(()=>browserSpeak(t))}
function party(){for(let n=0;n<11;n++){let e=document.createElement('span');e.className='conf';e.textContent=['🎉','✨','⭐','🎈'][n%4];e.style.left=(5+Math.random()*90)+'%';e.style.top='8%';document.body.appendChild(e);setTimeout(()=>e.remove(),1150)}}
function showLocked(){const o=document.getElementById('lockOverlay');document.getElementById('lockTitle').textContent=L==='ar'?'🔒 مرحلة مقفلة':L==='fr'?'🔒 Niveau verrouillé':'🔒 Locked level';document.getElementById('lockMsg').textContent=L==='ar'?'هذه المرحلة وما بعدها مقفلة. المرحلة الأولى والثانية فقط مفتوحتان للتجربة.':L==='fr'?'Ce niveau et les suivants sont verrouillés. Seuls les deux premiers sont ouverts.':'This level and all following levels are locked. Only the first two are open.';document.getElementById('lockClose').textContent=L==='ar'?'حسناً':L==='fr'?'D’accord':'OK';o.style.display='flex'}
document.getElementById('lockClose').onclick=()=>document.getElementById('lockOverlay').style.display='none';
function drawWorlds(){worlds.innerHTML='';D.forEach((x,i)=>{let b=document.createElement('button');b.className='world '+(i===W?'on':'');const isLocked=i>=2;b.textContent=(isLocked?'🔒 ':'🐧 ')+x.n+' — '+x[L];if(isLocked){b.style.opacity='.58';b.style.cursor='not-allowed';b.onclick=showLocked}else{b.onclick=()=>{W=i;G=0;drawWorlds();render(true)}};worlds.appendChild(b)})}
function render(talk=false){lock=false;feedback.textContent='';let x=D[W],g=x.games[G];meta.textContent=(L==='ar'?'العالم ':L==='fr'?'Monde ':'World ')+x.n+' — '+(G+1)+' / 10';question.textContent=g[L];answers.innerHTML='';shuffle([...g.opts]).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answer(v===g.correct);answers.appendChild(b)});if(talk)setTimeout(()=>speak(g[L]),120)}
function answer(ok){if(lock)return;if(!ok){let a=RETRY[L],t=a[Math.floor(Math.random()*a.length)];feedback.textContent=t;speak(t);return}lock=true;let a=CHEER[L],k;do{k=Math.floor(Math.random()*a.length)}while(k===last);last=k;feedback.textContent=a[k];party();speak(a[k]);setTimeout(()=>{G++;if(G<10){render(true)}else{G=0;if(W<1){W++;drawWorlds();render(true)}else{question.textContent='🔒';answers.innerHTML='';feedback.textContent=L==='ar'?'أحسنت! أنهيت المرحلتين المفتوحتين.':L==='fr'?'Bravo ! Tu as terminé les deux niveaux ouverts.':'Great job! You finished the two open levels.';speak(feedback.textContent);setTimeout(showLocked,500);return}/*locked*/if(false){question.textContent='🏆';answers.innerHTML='';feedback.textContent=L==='ar'?'ياااي! أنهيت التسعين لعبة يا بطل!':L==='fr'?'Youpi ! Tu as fini les 90 jeux !':'Yaaay! You finished all 90 games!';party();speak(feedback.textContent)}}},1450)}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('on',x===b));document.documentElement.dir=L==='ar'?'rtl':'ltr';drawWorlds();render(true)});
speaker.onclick=()=>speak(D[W].games[G][L]);drawWorlds();render(false);
</script></body></html>
